<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery · LensLink</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%232457f0'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='white' stroke-width='9'/%3E%3Ccircle cx='50' cy='50' r='9' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="nav scrolled">
  <div class="container nav-inner">
    <a class="brand" href="/index.html"><span class="brand-mark">◎</span><span>LensLink</span></a>
    <div class="nav-cta" id="navbar-root"></div>
  </div>
</nav>

<div id="gallery-root"></div>

<footer style="background:var(--mist);padding:26px 0;text-align:center;color:var(--muted);font-size:13.5px">
  Curated with <b style="color:var(--ink)">LensLink</b> — photo delivery for professional photographers
</footer>

<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script>
  const code = location.pathname.split('/').pop();
  const root = document.getElementById('gallery-root');
  ensureNav();
  initReveal();

  root.innerHTML = `
    <div class="view-hero">
      <div class="container">
        <span class="eyebrow">Shared gallery</span>
        <h1 class="skeleton" style="width:60%;margin-top:24px;height:44px;background:rgba(255,255,255,.08)"></h1>
        <p class="skeleton" style="width:44%;margin-top:16px;height:20px;background:rgba(255,255,255,.08)"></p>
      </div>
    </div>
    <div class="view-photos"><div class="container"><div class="photo-grid">${Array(6).fill(skeleton(220)).join('')}</div></div></div>`;

  API.get(`/share/${code}`)
    .then((g) => {
      const coverUrl = g.photos[0] ? `/api/photo/${g.photos[0].id}` : '';
      root.innerHTML = `
        <div class="view-hero">
          <div class="container">
            <span class="eyebrow">✨ Shared gallery</span>
            <h1>${esc(g.title)}</h1>
            ${g.description ? `<p class="desc">${esc(g.description)}</p>` : ''}
            <div class="meta-row">
              ${g.eventDate ? `<span class="m">📅 ${fmtDate(g.eventDate)}</span>` : ''}
              <span class="m">📸 ${g.photos.length} photo${g.photos.length === 1 ? '' : 's'}</span>
              <span class="m">by ${esc(g.admin)}</span>
            </div>
          </div>
        </div>
        <div class="view-photos">
          <div class="container">
            <p class="count-line">🖼 <b>${g.photos.length}</b> selected moments · click any photo to view full size</p>
            <div class="photo-grid" id="photo-grid">
              ${g.photos.map((p, i) => `
                <div class="photo-tile" data-i="${i}" style="animation-delay:${Math.min(i * 0.03, 0.6)}s">
                  <img src="/api/photo/${p.id}" loading="lazy" alt="">
                </div>`).join('') || '<p style="color:var(--muted);grid-column:1/-1;text-align:center;padding:40px">This gallery is being prepared — photos coming soon.</p>'}
            </div>
          </div>
        </div>`;
      initReveal();

      const gridEl = document.getElementById('photo-grid');
      gridEl.addEventListener('click', (e) => {
        const tile = e.target.closest('.photo-tile');
        if (!tile) return;
        openLightbox(g.photos.map((p) => ({ id: p.id, name: p.name })), Number(tile.dataset.i), `${String(g.title).replace(/[^\w]+/g, '-')}-${tile.dataset.i}`);
      });
    })
    .catch((err) => {
      root.innerHTML = `
        <div class="view-hero"><div class="container"><span class="eyebrow">Oops</span><h1>Gallery not found</h1></div></div>
        <div class="container" style="text-align:center;padding:60px 0">
          <p style="color:var(--muted);margin-bottom:22px">${esc(err.message)} — the link may be wrong or the gallery was removed.</p>
          <a class="btn btn-primary" href="/index.html">← Back to LensLink</a>
        </div>`;
    });
</script>
</body>
</html>
